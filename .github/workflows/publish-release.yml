name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create (e.g. v1.2.0). An existing release with this tag is updated.
        required: true
      title:
        description: Release title
        required: true
      notes:
        description: Release notes (Markdown)
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A release created with GITHUB_TOKEN does not trigger release.yml, so attach the asset here.
      # Release Drafter keeps a draft for the next tag; reuse it (or an existing release) and
      # always overwrite its title and notes, otherwise the draft's "No changes" body is kept.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --draft=false --target "$GITHUB_SHA"
            gh release upload "$TAG" dist/ha-switch-card.js --clobber
          else
            gh release create "$TAG" dist/ha-switch-card.js --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
