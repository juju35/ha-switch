name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check hacs.json points to the built file
        run: |
          file=$(node -p "require('./hacs.json').filename")
          test -f "dist/$file" || { echo "dist/$file not found"; exit 1; }

      - name: Check dist is up to date and valid
        run: npm run check
