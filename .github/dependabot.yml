version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-dev:
        dependency-type: development
        patterns: ["*"]
  # Bumps the hook revisions in .pre-commit-config.yaml. The biome hook's additional_dependencies pin
  # (@biomejs/biome) is not touched by Dependabot: keep it, biome.json and the Lint workflow in step by hand.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
